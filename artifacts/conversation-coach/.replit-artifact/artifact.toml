kind = "web"
previewPath = "/"
title = "Conversation Coach"
version = "1.0.0"
id = "artifacts/conversation-coach"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21392
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/conversation-coach run dev"

[services.env]
PORT = "21392"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/conversation-coach", "run", "build"]
publicDir = "artifacts/conversation-coach/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
